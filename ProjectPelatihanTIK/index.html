<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1030" />
  <meta name="description" content="AI Smart Student Assistant: asisten belajar, jadwal, dan karier untuk pelajar." />
  <title>AI Smart Student Assistant</title>

  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <a class="skip-link" id="skip-link" href="#main">Lewati ke konten utama</a>

  <div class="app" id="app">

    <!-- Sidebar: tampil di tablet dan desktop (diisi oleh nav.js) -->
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div class="brand sidebar__brand">
        <span class="brand__logo" id="sidebar-logo"></span>
        <span class="brand__text">Smart Student</span>
      </div>
      <nav class="sidebar__nav" id="sidebar-nav" aria-label="Menu halaman"></nav>
      <button type="button" class="btn sidebar__toggle" id="sidebar-toggle"></button>
    </aside>

    <div class="main-wrap" id="main-wrap">
      <!-- Topbar: hanya tampil di HP -->
      <header class="topbar">
        <div class="brand">
          <span class="brand__logo" id="topbar-logo"></span>
          <span class="brand__text">Smart Student</span>
        </div>
      </header>

      <!-- Tempat isi halaman -->
      <main id="main" tabindex="-1"></main>
    </div>

    <!-- Bottom navigation: hanya tampil di HP (diisi oleh nav.js) -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi bawah"></nav>

    <!-- Drawer menu tambahan untuk HP -->
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"></aside>

    <!-- Tempat notifikasi (toast) -->
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
  </div>

  <noscript>
    <p style="padding:1rem;color:#fff">Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript di browser kamu.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
